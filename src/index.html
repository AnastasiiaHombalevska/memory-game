<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory game</title>
  <link rel="stylesheet" href="/src/styles/style.css">
</head>

<body class="body">
  <header class="header">
    <div class="header__container">
      <button class="btn header__btn header__btn--start" type="button">
        Start New Game
      </button>

      <div class="game-info">
        <div class="game-info__item">
          <span class="game-info__label">Moves</span>
          <span class="game-info__value moves">0</span>
        </div>
        <div class="game-info__item">
          <span class="game-info__label">Time</span>
          <span class="game-info__value game-timer">00:00</span>
        </div>
        <div class="game-info__item">
          <span class="game-info__label">Pairs</span>
          <span class="game-info__value pairs">0 / 8</span>
        </div>
      </div>

      <button class="btn header__btn header__btn--leaderboard" type="button">
        Leaderboard
      </button>
    </div>
  </header>

  <div class="modal">
    <div class="modal__wrapper">
      <h2 class="modal__title">You win!</h2>
      
      <ul class="modal__list">
        <li class="modal__item">
          Your score:
          <span class="modal__data score"></span>
        </li>
        <li class="modal__item">
          Your time:
          <span class="modal__data time"></span>
        </li>
      </ul>
    </div>
  </div>

  <script src="./scripts/main.js"></script>
</body>
</html>
